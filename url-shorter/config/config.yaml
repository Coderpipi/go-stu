db:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: 123456
  db_name: url_db
  ssl_mode: disable
  max_idle_conns: 5
  max_open_conns: 5

redis:
  addr: "127.0.0.1:6379"
  db: 0

server_config:
  addr: ":8080"
  read_timeout: 5
  write_timeout: 5

app:
  base_url: "http://localhost:8080"
  default_duration: 10h
  cleanup_interval: 2h

shortcode_config:
  length: 8
